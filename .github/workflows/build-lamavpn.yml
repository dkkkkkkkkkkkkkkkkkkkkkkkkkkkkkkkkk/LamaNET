name: Build LamaVPN Android APK

on:
  push:
    branches: [lamavpn]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build native LamaVPN client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LamaVPN build scripts
        uses: actions/checkout@v4

      - name: Checkout pinned VPN Gate client engine
        uses: actions/checkout@v4
        with:
          repository: IyedAmiri/OpenGateVPN
          ref: 12f8ea97976f1bac0307a013b40712098b865d43
          path: upstream

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platforms
        uses: android-actions/setup-android@v3
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-37" "platforms;android-34" "build-tools;37.0.0" "build-tools;34.0.0"

      - name: Apply LamaVPN branding
        run: python3 scripts/rebrand.py upstream

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Upload LamaVPN APK
        uses: actions/upload-artifact@v4
        with:
          name: LamaVPN-native-debug-apk
          path: upstream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
