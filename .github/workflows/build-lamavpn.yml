name: Build LamaVPN APK

on:
  push:
    branches:
      - lamavpn
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LamaVPN Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out LamaVPN and engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Apply LamaVPN branding
        run: bash scripts/rebrand-lamavpn.sh

      - name: Build native Android APK
        working-directory: opengate-engine
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Upload LamaVPN APK
        uses: actions/upload-artifact@v4
        with:
          name: LamaVPN-debug-apk
          path: opengate-engine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
